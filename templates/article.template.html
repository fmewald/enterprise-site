<!doctype html>
<html lang="pt-BR">
<head>
{{HEAD}}
</head>
<body>
<a class="skip" href="#conteudo">Ir para o conteúdo</a>
{{HEADER}}
<main id="conteudo">
<section class="phero phero--article"><div class="phero__arc" aria-hidden="true"></div><div class="wrap">{{BREADCRUMB}}<span class="eyebrow">{{CATEGORY}}</span><h1>{{TITLE}}</h1><p class="lead">{{DESCRIPTION}}</p><div class="article-meta"><span class="article-meta__text">Publicado em {{PUBLISHED}} · Atualizado em {{UPDATED}} · {{AUTHOR}}</span></div></div></section>
<section class="section article-section"><div class="wrap"><article class="prose article-content">{{DIRECT_ANSWER}}{{CONTENT}}{{SOURCES}}{{AUTHORITY_NOTE}}{{CTA}}</article></div></section>
<section class="section section--muted related-articles" aria-labelledby="related-title"><div class="wrap"><div class="related-articles__head"><span class="eyebrow">Continue lendo</span><h2 id="related-title">Leia também</h2></div><div class="related-articles__grid">{{RELATED}}</div></div></section>
</main>
{{FOOTER}}{{WA}}{{COOKIE}}
<script src="/assets/js/main.js" defer></script>
