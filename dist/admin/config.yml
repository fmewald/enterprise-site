backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow
locale: pt
media_folder: "assets/img/blog"
public_folder: "/assets/img/blog"
site_url: https://enterprisecontabilidade.com.br
display_url: https://enterprisecontabilidade.com.br
logo_url: https://enterprisecontabilidade.com.br/assets/img/logo-horizontal.svg

collections:
  - name: "blog"
    label: "Artigos do Blog"
    label_singular: "Artigo"
    folder: "posts"
    create: true
    slug: "{{fields.slug}}"
    extension: "md"
    format: "frontmatter"
    description: "Use o fluxo editorial para salvar como rascunho, enviar para revisão e publicar. O artigo somente aparecerá no site após a publicação e a conclusão do deploy da Netlify."
    identifier_field: titulo
    summary: "{{titulo}} — {{data}}"
    sortable_fields: [data, atualizado, titulo]
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use letras minúsculas, números e hífens."] }
      - { label: "Título para SEO", name: "seo_title", widget: "string", required: false }
      - { label: "Descrição", name: "resumo", widget: "text" }
      - { label: "Resposta direta / Em resumo", name: "resposta_direta", widget: "text", hint: "Dois a quatro parágrafos curtos, com conclusão e condicionantes." }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options: ["Reforma Tributária", "Simples Nacional", "Transporte", "Construção", "Saúde", "Prestadores de Serviço", "Gestão Financeira", "Gestão", "Contabilidade"]
      - { label: "Imagem de capa", name: "capa", widget: "image", required: false }
      - { label: "Texto alternativo da imagem", name: "capa_alt", widget: "string", required: false }
      - { label: "Data de publicação", name: "data", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Data de atualização", name: "atualizado", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Autor", name: "autor", widget: "string", default: "Equipe Técnica da Enterprise Assessoria Contábil" }
      - { label: "Revisor", name: "revisor", widget: "string", required: false }
      - label: "Fontes oficiais"
        name: "sources"
        widget: "list"
        required: false
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "URL", name: "url", widget: "string", pattern: ["^https://", "Use uma URL HTTPS."] }
          - { label: "Data de acesso", name: "accessed", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Redirecionamentos anteriores", name: "redirect_from", widget: "list", required: false, field: { label: "Caminho antigo", name: "path", widget: "string" } }
      - { label: "Interesse do CTA", name: "cta_interesse", widget: "hidden", default: "diagnostico-geral" }
      - { label: "Serviço do CTA", name: "cta_servico", widget: "hidden", default: "contabilidade" }
      - { label: "Segmento do CTA", name: "cta_segmento", widget: "hidden", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown", hint: "Use o fluxo editorial para salvar, revisar e publicar. Não existe um segundo campo de status." }
